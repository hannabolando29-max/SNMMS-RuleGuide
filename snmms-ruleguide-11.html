ny lawful order of the duly constituted authorities of the school or its agents, representatives, or security guards|3.39.9 Estafa, theft, larceny, or other analogous crimes committed against any student, official, teacher, personnel, security guard, or representative|3.39.10 Extorting, mulcting, or periodic unauthorized solicitations of any amount of money, quantity of goods, or materials, or any volume of property from the students and/or from any person inside the campus|3.39.11 Unauthorized fund-raising activities and solicitations of money, property, goods, or the like from any student, official, teacher, personnel, security guard, or representative|3.39.12 Unauthorized solicitations of money, property, goods, or the like from outside sources|3.39.13 Stealing or asportation of books and other similar materials from the library, laboratories, audiovisual rooms, function rooms, and other similar places in the school|3.39.14 Disrupting classes and barricading the school entrance|3.39.15 Selling examination paper|3.39.16 Lying at the hearing on the charges against himself|3.39.17 Assaulting, boxing, stoning, stabbing, and other forms of physical attacks or assaults against any student, official, teacher, personnel, security guard, or representative|3.39.18 Beating up another student|3.39.19 Attempting to bribe any school official or teacher|3.39.20 Refusing to identify the student who violated a school regulation when he/she knew|3.39.21 Forcing a student to become a member of a fraternity or sorority|3.40 Hazing|3.41 Hooliganism like bullying, among others|3.42 Immorality|3.42.1 Possession, distribution, or use of any pornographic material, whether through cellular phones, compact discs, magazines, posters, pictures, or illustrations|3.42.2 Acts of lasciviousness, lewd, or indecent language and other similar acts inside the campus|3.42.3 Abortion, in the case of pregnant female student by herself, through a doctor, or any student; aiding in abortion by a pregnant if(pg==="hb")return `<section><h2>Student Handbook – Offenses</h2>${1?'<div class="search-box"><input placeholder="Search offense or category..." oninput="q=this.value;$(\'#tb\').innerHTML=ht()"></div>':""}<div class="table-container" id="tb">${ht()}</div></section>`+(me.role==="admin"?`<section><h2>Add Offense to Handbook List</h2><form onsubmit="return ao()"><label>Category</label><select id="ac">${Object.keys(CATS).map(k=>`<option value="${k}">${CATS[k].n}</option>`).join("")}</select><label>Offense</label><input id="at" required><button>Add Offense</button></form></section>`:"");
if(pg==="usr"&&me.role==="admin")return `<section><h2>My SSLG Accounts</h2><div class="table-container"><table><tr><th>Name</th><th>Username</th><th>Status</th><th></th></tr>${mine().sort((a,b)=>(b.status==="pending")-(a.status==="pending")).map(u=>`<tr><td>${E(u.name)}</td><td>${E(u.un)}</td><td>${u.status==="pending"?"<b style='color:#b5121b'>Pending</b>":"Active"}</td><td>${u.status==="pending"&&(!u.admin||u.admin===me.id)?`<button class="yellow" onclick="ap('${u.id}')">Approve</button> `:""}<button onclick="du('${u.id}')">Remove</button></td></tr>`).join("")}${mine().length?"":"<tr><td colspan=4>No SSLG accounts under you yet.</td></tr>"}</table></div></section><section><h2>Create SSLG Account</h2><form onsubmit="return mkAcc()"><label>Full Name</label><input id="cn" required><label>Username</label><input id="cu" autocapitalize="none" required><label>Password</label><input id="cp" type="password" required><p class="small-text">Accounts created by an Admin are active right away, no approval needed.</p><div class="message" id="er"></div><button>Create SSLG Account</button></form></section>`;return ""}
let pre="",grp=[];const ky=v=>v.date+(v.time||"");
function vt(){const k=q.toLowerCase(),m={};db.vio.forEach(v=>{const n=v.sname.trim().toLowerCase();(m[n]=m[n]||{name:v.sname.trim(),l:[]}).l.push(v)});
grp=Object.values(m).filter(g=>!k||(g.name+g.l.map(v=>v.text+v.code).join(" ")).toLowerCase().includes(k));grp.forEach(g=>g.l.sort((a,b)=>ky(a).localeCompare(ky(b))));grp.sort((a,b)=>ky(b.l[b.l.length-1]).localeCompare(ky(a.l[a.l.length-1])));
if(!grp.length)return "<p>No violations recorded.</p>";const s=staff();
return `<table><tr><th>Student</th><th>Violations</th></tr>${grp.map((g,i)=>`<tr><td><b>${E(g.name)}</b><br><small>${g.l.length} violation${g.l.length>1?"s":""}</small>${s?`<br><button class="yellow" onclick="ad(${i})">+ Add</button>`:""}</td><td>${g.l.map((v,n)=>`<div style="padding:6px 0;${n?"border-top:1px dashed #ccc":""}"><b>${n+1}.</b> ${E(v.text)} <small>(${CATS[v.cat].n}${v.code?", "+E(v.code):""})</small><br><small>${E(v.date)} ${tf(v.time)} • Sanction: ${E(v.sanction)} • By ${E(v.by)}${v.notes?"<br>Notes: "+E(v.notes):""}</small>${s?`<br><button class="yellow" onclick="eid='${v.id}';go2()">Edit</button> <button onclick="dv('${v.id}')">Delete</button>`:""}</div>`).join("")}</td></tr>`).join("")}</table>`}
function ad(i){pre=grp[i].name;eid=null;pg="add";R()}
const p2=n=>String(n).padStart(2,"0"),nd=()=>{const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())},nt=()=>{const d=new Date();return p2(d.getHours())+":"+p2(d.getMinutes())},tf=t=>{if(!t)return "";const[h,m]=t.split(":").map(Number);return (h%12||12)+":"+p2(m)+" "+(h<12?"AM":"PM")};
function go2(){pg="add";R()}
function dv(id){if(confirm("Delete this violation?")){db.vio=db.vio.filter(v=>v.id!==id);save();R()}}
function ht(){const k=q.toLowerCase();return `<table><tr><th>Code</th><th>Offense</th><th>Category</th><th>Sanctions</th>${me.role==="admin"?"<th></th>":""}</tr>${offs().filter(o=>!k||(o.text+o.code+CATS[o.cat].n).toLowerCase().includes(k)).map(o=>`<tr><td>${E(o.code)}</td><td>${E(o.text)}</td><td>${CATS[o.cat].n}</td><td>${CATS[o.cat].c.map((c,i)=>(CATS[o.cat].c.length>1?["1st","2nd","3rd"][i]+": ":"")+E(c)).join("<br>")}</td>${me.role==="admin"?`<td>${o.custom?`<button onclick="dc('${o.code}')">Remove</button>`:""}</td>`:""}</tr>`).join("")}</table>`}
function ao(){db.custom.push({cat:$("#ac").value,code:"C"+Date.now(),text:$("#at").value.trim(),custom:1});save();R();return false}
function dc(c){db.custom=db.custom.filter(o=>o.code!==c);save();R()}
function rc(id,r){db.users.find(x=>x.id===id).role=r;save()}
function mkAcc(){sync();const un=$("#cu").value.trim().toLowerCase(),pw=$("#cp").value;if(pw.length<4)return er("Password must be at least 4 characters.");if(db.users.some(u=>u.un===un))return er("Username already taken.");db.users.push({id:"u"+Date.now(),name:$("#cn").value.trim(),role:"sslg",un,pw:H(pw),admin:me.id,status:"ok"});save();R();er("SSLG account created! They can now log in at the main login with username: "+un);$("#er").style.color="#2e7d32";return false}
function ap(id){sync();db.users.find(x=>x.id===id).status="ok";save();R()}
function du(id){if(confirm("Remove this user?")){sync();db.users=db.users.filter(u=>u.id!==id);save();R()}}
function sug(nm,cat){nm=nm.trim().toLowerCase();const n=db.vio.filter(v=>v.sname.trim().toLowerCase()===nm&&v.cat===cat&&v.id!==eid).length,a=CATS[cat].c;return[n+1,a[Math.min(n,a.length-1)]]}
function oo(c,s){return offs().filter(o=>o.cat===c).map(o=>`<option value="${E(o.code)}" ${o.code===s?"selected":""}>${E(o.code)} ${E(o.text)}</option>`).join("")}
function form(){const v=db.vio.find(x=>x.id===eid)||{};const c=v.cat||"L";
return `<section><h2>${eid?"Edit":"Add"} Violation</h2><form onsubmit="return sv()"><label>Student Name</label><input id="fs" required placeholder="Type the student's name" onchange="sg()" value="${E(v.sname||pre)}"><label>Category <small>(automatic)</small></label><select id="fc" disabled>${Object.keys(CATS).map(k=>`<option value="${k}" ${k===c?"selected":""}>${CATS[k].n}</option>`).join("")}</select><label>Violation</label><select id="fo" required onchange="oc()">${vo(v)}</select><label>Date</label><input id="fd" type="date" required value="${v.date||nd()}"><label>Time</label><input id="ft" type="time" required value="${v.time||nt()}"><label>Sanction <small id="fh"></small></label><input id="fa" value="${E(v.sanction||sug(v.sname||pre,c)[1])}"><label>Notes</label><textarea id="fn" rows="2">${E(v.notes||"")}</textarea><button>Save Violation</button><button type="button" class="yellow" onclick="go('vio')">Cancel</button></form></section>`}
function vo(v){v=v||{};let h='<option value="">-- Choose the violation --</option>',f=0;Object.keys(CATS).forEach(k=>{const L=offs().filter(o=>o.cat===k);if(!L.length)return;h+=`<optgroup label="${E(CATS[k].n)}">`;L.forEach(o=>{const sel=o.code===v.code&&v.cat===k;if(sel)f=1;const t=o.text.length>110?o.text.slice(0,107)+"...":o.text;h+=`<option value="${E(o.code)}" ${sel?"selected":""}>${E(o.code)} ${E(t)}</option>`});h+="</optgroup>"});if(v.text&&!f)h+=`<option value="__old" selected>${E(v.text)}</option>`;return h}
function oc(){const o=offs().find(x=>x.code===$("#fo").value);if(o)$("#fc").value=o.cat;sg()}
function sg(){const r=sug($("#fs").value,$("#fc").value);$("#fa").value=r[1];$("#fh").textContent="(offense no. "+r[0]+" in this category)"}
function sv(){const sname=$("#fs").value.trim(),fv=$("#fo").value,o=offs().find(x=>x.code===fv),cat=o?o.cat:$("#fc").value,old=db.vio.find(x=>x.id===eid),text=o?o.text:(fv==="__old"&&old?old.text:"");if(!sname||!text){alert("Please choose a violation.");return false}
const r={id:eid||"v"+Date.now(),sname,cat,code:o?o.code:(old?old.code:""),text,date:$("#fd").value,time:$("#ft").value,sanction:$("#fa").value,notes:$("#fn").value,by:me.name};
db.vio=eid?db.vio.map(x=>x.id===eid?r:x):db.vio.concat(r);save();eid=null;pre="";pg="vio";R();return false}
R();
</script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyB4aV8E9hmYRX3D3Zu2pJ_NKNjRMcur0Z0",authDomain:"violation-c884a.firebaseapp.com",projectId:"violation-c884a",storageBucket:"violation-c884a.firebasestorage.app",messagingSenderId:"820362367722",appId:"1:820362367722:web:9162a653c0585f31d2bd93",measurementId:"G-2KPFQ6NC4X"});
const fs=getFirestore(app);
const KEY={users:u=>u.id,vio:v=>v.id,custom:o=>o.code};
const NAME={users:"users",vio:"violations",custom:"customOffenses"};
const last={users:new Map(),vio:new Map(),custom:new Map()};
const first={};let warned=false;
const localInit=JSON.parse(JSON.stringify(db));
const num=x=>parseInt(String(x).replace(/\D/g,""))||0;
function fail(e){console.error(e);if(!warned){warned=true;alert("Could not save to the online database: "+e.message)}}
function apply(k,snap){const arr=snap.docs.map(d=>d.data()).sort((a,b)=>num(KEY[k](a))-num(KEY[k](b)));db[k]=arr;last[k]=new Map(arr.map(r=>[KEY[k](r),JSON.stringify(r)]))}
window.cloudSave=function(){if(!CLOUD.ready)return;for(const k in KEY){const cur=new Map(db[k].map(r=>[KEY[k](r),r]));
cur.forEach((r,id)=>{const j=JSON.stringify(r);if(last[k].get(id)!==j){last[k].set(id,j);setDoc(doc(fs,NAME[k],id),JSON.parse(j)).catch(fail)}});
[...last[k].keys()].forEach(id=>{if(!cur.has(id)){last[k].delete(id);deleteDoc(doc(fs,NAME[k],id)).catch(fail)}})}};
function after(){try{localStorage.setItem("snmms",JSON.stringify(db))}catch(e){}
const a=document.activeElement,typing=a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName);
if(me){const m=db.users.find(u=>u.id===me.id);if(!m||m.status==="pending"||m.role==="student"){out();return}me=m;if(pg!=="add"&&!typing)R()}else if(!typing)R()}
for(const k in KEY){onSnapshot(collection(fs,NAME[k]),snap=>{
if(!CLOUD.ready){if(snap.empty&&snap.metadata.fromCache)return;first[k]=snap;
if(Object.keys(KEY).every(x=>first[x])){const empty=Object.values(first).every(x=>x.empty);for(const x in KEY)apply(x,first[x]);
CLOUD.ready=true;CLOUD.failed=false;
if(empty&&(localInit.users.length||localInit.vio.length||localInit.custom.length)){for(const x in KEY)db[x]=localInit[x];cloudSave()}
after()}}
else{apply(k,snap);after()}},err=>{CLOUD.failed=true;console.error(err)})}
</script></body></html>
